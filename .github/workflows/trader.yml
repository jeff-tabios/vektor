name: Trader

on:
  schedule:
    - cron: '30 14 * * 1-5'  # primary
    - cron: '35 14 * * 1-5'  # backup 1
    - cron: '40 14 * * 1-5'  # backup 2
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip if already ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh run list --workflow=trader.yml --repo jeff-tabios/vektor \
            --status=success --limit=10 \
            --json startedAt --jq "[.[] | select(.startedAt | startswith(\"$TODAY\"))] | length")
          if [ "$COUNT" -gt "0" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Already ran successfully today — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  trade:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        asset: [SPY, QQQ, NVDA, TSLA, AAPL, AMD]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Vektor/trader/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r Vektor/ingestion/requirements.txt
          pip install -r Vektor/reranker/requirements.txt
          pip install -r Vektor/trader/requirements.txt

      - name: Trade ${{ matrix.asset }}
        working-directory: Vektor/trader
        run: python main.py ${{ matrix.asset }}

  close:
    runs-on: ubuntu-latest
    needs: [check, trade]
    if: needs.check.outputs.should_run == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Vektor/trader/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r Vektor/trader/requirements.txt

      - name: Close settled trades
        working-directory: Vektor/trader
        run: python closer.py

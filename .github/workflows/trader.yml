name: Trader

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  trade:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        asset: [SPY, QQQ, BTC, ETH]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Vektor/trader/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r Vektor/ingestion/requirements.txt
          pip install -r Vektor/reranker/requirements.txt
          pip install -r Vektor/trader/requirements.txt

      - name: Trade ${{ matrix.asset }}
        working-directory: Vektor/trader
        run: python main.py ${{ matrix.asset }}

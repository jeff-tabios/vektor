name: Keep HF Space Alive

on:
  schedule:
    - cron: '0 9 * * *'  # daily at 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vektor dashboard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://huggingface.co/spaces/jefftabios/vektor)
          echo "Response: $STATUS"

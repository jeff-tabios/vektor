name: Ingestion

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4h for fresh knowledge
    - cron: '0 14 * * 1-5'  # dedicated market open run — also triggers trader
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Vektor/ingestion/requirements.txt

      - name: Check secrets
        run: |
          [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL set" || echo "SUPABASE_URL MISSING"
          [ -n "$SUPABASE_KEY" ] && echo "SUPABASE_KEY set" || echo "SUPABASE_KEY MISSING"
          [ -n "$GROQ_API_KEY" ] && echo "GROQ_API_KEY set" || echo "GROQ_API_KEY MISSING"

      - name: Install dependencies
        run: pip install -r Vektor/ingestion/requirements.txt

      - name: Run ingestion
        working-directory: Vektor/ingestion
        run: python main.py

      - name: Deploy dashboard to HF Spaces
        run: |
          pip install huggingface_hub
          hf auth login --token $HF_TOKEN
          cd Vektor/dashboard
          hf upload jefftabios/vektor . --repo-type space

      - name: Trigger trader at market open (14:00-15:00 UTC weekdays)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          WEEKDAY=$(date -u +%u)
          if [ "$WEEKDAY" -le "5" ] && [ "$HOUR" -eq "14" ]; then
            echo "Market hours — triggering trader..."
            gh workflow run trader.yml --repo jeff-tabios/vektor
          else
            echo "Outside market hours (weekday=$WEEKDAY, hour=$HOUR UTC) — skipping trader"
          fi
